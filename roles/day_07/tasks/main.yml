---
# tasks file for day_07
- name: Create group test
  ansible.builtin.group:
    name: test 
    state: present 

- name: Create group prod
  ansible.builtin.group:
    name: prod
    state: present 


- name: Create users 
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: 'test'
    groups: 'prod'
    create_home: true 
    generate_ssh_key: true 
    ssh_key_type: ed25519
    password: "{{ item.password | password_hash('sha512') }}"
  loop: "{{ users_passwords }}"


