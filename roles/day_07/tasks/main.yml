- name: config ssh 
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: '^#PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present 
  notify: Restart ssh

- name: config ssh 2 
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: '^#PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: Restart ssh

- name: Install utils on Ubuntu 
  ansible.builtin.apt:
    name: "{{ utils }}"
    state: present 
  when: ansible_os_family == "Debian"


- name: Install utils on other OS
  ansible.builtin.dnf:
    name: "{{ utils }}"
    state: present
  when: ansible_os_family != "Debian"

- name: copy /tmp-cleaner
  ansible.builtin.copy:
    src: /Users/dimas/ansible_practice/roles/clean_tmp.sh
    dest: /usr/local/bin/clean_tmp.sh
    mode: '0755'
    owner: root 
    group: root 
  
- name: set cleaner to crontab 
  ansible.builtin.cron:
    name: "Cleaner for tmp"
    job: "/usr/local/bin/clean_tmp.sh /tmp"
    minute: "*/30"
    user: root 
