---
# tasks file for day_06

- name: create a group for node exporter 
  ansible.builtin.group:
    name: node_exporter
    state: present
    system: true 


- name: create user 
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    system: true 
    create_home: false

- name: Install binary file of Node Exporter
  ansible.builtin.get_url:
    url: https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-arm64.tar.gz
    dest: "{{ temporary_folder }}/node_exporter-1.12.1.linux-arm64.tar.gz"
    checksum: sha256:ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7
    mode: '0755'

- name: Unarchive binary file 
  ansible.builtin.unarchive:
    src: /tmp/node_exporter-1.12.1.linux-arm64.tar.gz
    dest: "{{ path_for_node_exporter }}"
    remote_src: yes 
    owner: node_exporter
    group: node_exporter
    extra_opts: [--strip-components=1] #чтобы не создавался файл node_exporter....

- name: Copy Unit-file 
  ansible.builtin.template:
    src: ./node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify: 
    - Reload systemd daemon
    - Restart Node Exporter
    
- name: Start Node Exporter 
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: yes 

