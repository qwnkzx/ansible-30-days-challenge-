---
# tasks file for day_04

- name: Create dir for app 
  ansible.builtin.file:
    path: "{{ path_app }}"
    mode: '0700'
    owner: "{{ main_user }}"
    state: directory 

- name: make log file and add settings 
  ansible.builtin.copy:
    dest: "{{ path_app }}/app.log"
    content: "Application get ready!"
    owner: "{{ main_user }}"
    mode: '0640'

  